---
apiVersion: "v2"
name: "opencloud"
description: "Helm chart for OpenCloud, the file sync and share platform"
type: "application"
version: "0.7.0"
# Kept in step with image.tag in values.yaml.
# renovate: image=docker.io/opencloudeu/opencloud-rolling
appVersion: "9.1.0"
kubeVersion: ">=1.27.0-0"
home: "https://github.com/s7n-systems/opencloud-chart"
icon: "https://raw.githubusercontent.com/opencloud-eu/opencloud-compose/main/config/keycloak/themes/opencloud/login/resources/img/logo.svg"
keywords:
  - "opencloud"
  - "file-sharing"
  - "file-sync"
  - "webdav"
  - "cloud-storage"
  - "collaboration"
  - "caldav"
  - "carddav"
sources:
  - "https://github.com/s7n-systems/opencloud-chart"
  - "https://github.com/opencloud-eu/opencloud"
  - "https://github.com/opencloud-eu/opencloud-compose"
maintainers:
  - name: "s7n systems"
    email: "tom@sovereign-systems.eu"
    url: "https://github.com/s7n-systems"
dependencies:
  - name: "common"
    version: "2.41.0"
    repository: "oci://registry-1.docker.io/bitnamicharts"
# Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/). Update `changes`
# for every release; tests/render.py checks that `images` matches values.yaml.
annotations:
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/category: "storage"
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: "OpenCloud documentation"
      url: "https://docs.opencloud.eu"
    - name: "Upgrade notes"
      url: "https://github.com/s7n-systems/opencloud-chart/blob/main/docs/upgrading.md"
  artifacthub.io/images: |
    - name: "opencloud"
      image: "docker.io/opencloudeu/opencloud-rolling:9.1.0@sha256:f902f3cb5c247e3780dc133476c4c4f8d3377a638f15734d1d926c5f011c1fa7"
    - name: "yjs"
      image: "docker.io/opencloudeu/yjs:1.1.1@sha256:370ea8387e7896470b0c52d38769359ad5772d79a403d1bb5eb6d047b0789b35"
    - name: "radicale"
      image: "docker.io/opencloudeu/radicale:v3.9.0@sha256:497d9a480bdbbbf8666e0bc4fc1298d71694571043d42c688f0b5597757f2dd2"
    - name: "tika"
      image: "docker.io/apache/tika:4.2.0@sha256:b99f19c4fd76237dafe7d22f719b9bddfa9a449da687c597a41e2f6d9a595418"
  artifacthub.io/changes: |
    - kind: "fixed"
      description: "Disable OpenCloud's advertised CalDAV/CardDAV endpoints when Radicale is disabled; leave Radicale off in the Keycloak/S3 example"
    - kind: "changed"
      description: "Shared NFS tests disable directory lookup caching and verify immediate directory-link visibility between nodes"
    - kind: "added"
      description: "helm test checks the web port, the storage pods in topology split, and yjs, Tika and Radicale"
    - kind: "added"
      description: "NOTES.txt with the public URL, first sign-in and warnings for risky settings"
    - kind: "added"
      description: "priorityClassName and sidecars for every workload, persistence.retentionPolicy for OpenCloud and Radicale, service.loadBalancerClass"
    - kind: "added"
      description: "Artifact Hub metadata"
    - kind: "changed"
      description: "Radicale v3.9.0 pinned to a newer build of the same version"
    - kind: "added"
      description: "frontend.autoscaling: memory target, raw metrics and behavior; requests are required on every frontend container, sidecars included"
    - kind: "changed"
      description: "frontend.autoscaling.scaleDownStabilizationWindowSeconds is replaced by frontend.autoscaling.behavior"
    - kind: "added"
      description: "networkPolicy.enabled also restricts yjs and Tika, and admits yjs to OpenCloud's web port"
    - kind: "added"
      description: "frontend.podAntiAffinityPreset; extra environment, volumes, init containers, probes and ServiceAccount for yjs, Radicale and Tika"
...
