---
# Two pods on different workers share one NFS volume: the first writes a file,
# sets an extended attribute and holds an exclusive flock; the second must see
# the content and the attribute and must not get the lock. Then both sides
# create directory links which the other must see immediately, after caching
# a negative lookup. OpenCloud's metadata path traversal uses such links.
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "nfs-check"
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: "nfs-rwx"
  resources:
    requests: {storage: "1Gi"}
...
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "nfs-check"
data:
  check.py: |
    import fcntl, os, sys, time
    role, path = sys.argv[1], "/shared/probe.txt"
    rounds = 50
    def signal(name, value):
        temporary = f"/shared/{name}.{role}.tmp"
        with open(temporary, "w") as f:
            f.write(value)
        os.replace(temporary, f"/shared/{name}")
    def wait_signal(name, value):
        deadline = time.monotonic() + 120
        while time.monotonic() < deadline:
            try:
                if open(f"/shared/{name}").read() == value:
                    return
            except FileNotFoundError:
                pass
            time.sleep(0.01)
        sys.exit(f"FAIL {role}: timed out waiting for {name}={value}")
    def link_path(owner, i):
        return f"/shared/lookup-{owner}/entry-{i}"
    def expect_missing(owner, i):
        try:
            os.readlink(link_path(owner, i))
        except FileNotFoundError:
            return
        sys.exit(f"FAIL {role}: unexpected existing directory link")
    def create_link(owner, i):
        target = f"/shared/lookup-{owner}/objects/node-{i}"
        os.mkdir(target)
        os.setxattr(target, "user.opencloud.test", str(i).encode())
        os.symlink(f"objects/node-{i}", link_path(owner, i))
    def verify_link(owner, i):
        # Do not retry the target lookup: immediate visibility is the assertion.
        link = link_path(owner, i)
        target = os.readlink(link)
        assert target == f"objects/node-{i}", (link, target)
        assert os.getxattr(os.path.join(os.path.dirname(link), target), "user.opencloud.test") == str(i).encode(), link
    if role == "holder":
        for owner in ("holder", "checker"):
            os.makedirs(f"/shared/lookup-{owner}/objects")
        with open(path, "w") as f:
            f.write("shared content\n")
        os.setxattr(path, "user.opencloud.test", b"xattr-value")
        with open(path + ".lock", "w") as lock:
            fcntl.flock(lock, fcntl.LOCK_EX)
            open("/shared/locked", "w").close()
            print("holder: lock taken", flush=True)
            for i in range(rounds):
                wait_signal("lookup-command", f"create:{i}")
                create_link("holder", i)
                expect_missing("checker", i)
                signal("lookup-ack", f"created:{i}")
                wait_signal("lookup-command", f"reply:{i}")
                verify_link("checker", i)
                signal("lookup-ack", f"verified:{i}")
            # Keep the lock until the checker finishes, including slow image
            # pulls. The runner times out after 300s; bound this wait too.
            for _ in range(330):
                if os.path.exists("/shared/checked"):
                    break
                time.sleep(1)
            else:
                sys.exit("FAIL holder: checker never finished")
        sys.exit(0)
    for _ in range(120):
        if os.path.exists("/shared/locked"):
            break
        time.sleep(1)
    else:
        sys.exit("FAIL checker: holder never took the lock")
    ok = True
    content = open(path).read()
    if content != "shared content\n":
        print(f"FAIL content not visible: {content!r}"); ok = False
    try:
        value = os.getxattr(path, "user.opencloud.test")
        if value != b"xattr-value":
            print(f"FAIL xattr differs: {value!r}"); ok = False
    except OSError as error:
        print(f"FAIL xattr not readable over NFS: {error}"); ok = False
    with open(path + ".lock", "w") as lock:
        try:
            fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
            print("FAIL lock was granted although the other node holds it"); ok = False
        except BlockingIOError:
            print("ok   lock held by the other node is respected")
    for i in range(rounds):
        expect_missing("holder", i)
        signal("lookup-command", f"create:{i}")
        wait_signal("lookup-ack", f"created:{i}")
        verify_link("holder", i)
        create_link("checker", i)
        signal("lookup-command", f"reply:{i}")
        wait_signal("lookup-ack", f"verified:{i}")
    print(f"ok   {rounds} immediate directory-link lookups in each direction", flush=True)
    open("/shared/checked", "w").close()
    print("NFS CHECK PASSED" if ok else "NFS CHECK FAILED", flush=True)
    sys.exit(0 if ok else 1)
...
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "nfs-holder"
  labels: {app: "nfs-check"}
spec:
  restartPolicy: "Never"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector: {matchLabels: {app: "nfs-check"}}
          topologyKey: "kubernetes.io/hostname"
  containers:
    - name: "check"
      image: "docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd"
      command: ["python3", "/check/check.py", "holder"]
      volumeMounts:
        - {name: "shared", mountPath: "/shared"}
        - {name: "check", mountPath: "/check"}
  volumes:
    - name: "shared"
      persistentVolumeClaim: {claimName: "nfs-check"}
    - name: "check"
      configMap: {name: "nfs-check"}
...
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "nfs-checker"
  labels: {app: "nfs-check"}
spec:
  restartPolicy: "Never"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector: {matchLabels: {app: "nfs-check"}}
          topologyKey: "kubernetes.io/hostname"
  containers:
    - name: "check"
      image: "docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd"
      command: ["python3", "/check/check.py", "checker"]
      volumeMounts:
        - {name: "shared", mountPath: "/shared"}
        - {name: "check", mountPath: "/check"}
  volumes:
    - name: "shared"
      persistentVolumeClaim: {claimName: "nfs-check"}
    - name: "check"
      configMap: {name: "nfs-check"}
...
