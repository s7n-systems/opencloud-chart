{{- if and .Values.networkPolicy.enabled (and .Values.tika.enabled (not .Values.tika.externalUrl)) }}
{{- $ctx := dict "component" "tika" "context" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencloud.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "opencloud.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  # Health probes come from the node and are always allowed.
  ingress:
    - from:
        # OpenCloud's search service, in whichever OpenCloud pod runs it.
        - podSelector:
            matchLabels:
              {{- include "common.labels.matchLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [server, frontend]
        {{- if .Values.tests.enabled }}
        # The helm test pod.
        - {{ include "opencloud.testPeer" . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9998
{{- end }}
