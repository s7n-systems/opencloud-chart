{{- if .Values.radicale.enabled }}
{{- $ctx := dict "component" "radicale" "context" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencloud.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "opencloud.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # A podSelector alone restricts peers to this namespace. Only the
        # OpenCloud proxy, which authenticates users, may reach Radicale.
        - podSelector:
            matchLabels:
              {{- include "opencloud.proxySelectorLabels" . | nindent 14 }}
        {{- if .Values.tests.enabled }}
        # The helm test pod, which only checks that the port answers.
        - {{ include "opencloud.testPeer" . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5232
{{- end }}
