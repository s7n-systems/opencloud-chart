{{- if and .Values.networkPolicy.enabled .Values.yjs.enabled }}
{{- $ctx := dict "component" "yjs" "context" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencloud.componentFullname" $ctx }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "opencloud.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "opencloud.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  # Health probes come from the node and are always allowed.
  ingress:
    - from:
        # Only the OpenCloud proxy, which routes /yjs to it.
        - podSelector:
            matchLabels:
              {{- include "opencloud.proxySelectorLabels" . | nindent 14 }}
        {{- if .Values.tests.enabled }}
        # The helm test pod.
        - {{ include "opencloud.testPeer" . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 1234
{{- end }}
